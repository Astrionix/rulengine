<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — IntraBot Pro</title>
    <meta name="description" content="Register a new IntraBot Pro trading account.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 15px; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #030610;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(59,130,246,0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139,92,246,0.10) 0%, transparent 40%);
            padding: 2rem;
        }
        .card {
            width: 100%; max-width: 420px;
            background: rgba(15,23,42,0.85);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 24px 80px rgba(0,0,0,0.6);
            animation: fadeUp .5s ease;
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:none; } }
        .logo { text-align: center; margin-bottom: 1.75rem; }
        .logo-icon {
            width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 0.75rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; box-shadow: 0 8px 24px rgba(59,130,246,0.4);
        }
        h1 { font-size: 1.5rem; font-weight: 700; color: #f1f5f9; text-align: center; }
        .subtitle { color: #64748b; font-size: 0.875rem; text-align: center; margin-top: .3rem; margin-bottom: 1.75rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; color: #94a3b8; font-size: 0.8rem; font-weight: 500; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: .05em; }
        input {
            width: 100%; padding: .75rem 1rem;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; color: #f1f5f9; font-family: inherit; font-size: .95rem;
            outline: none; transition: all .2s;
        }
        input:focus { border-color: #3b82f6; background: rgba(59,130,246,0.08); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        input::placeholder { color: #475569; }
        .pass-wrap { position: relative; }
        .pass-toggle {
            position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%);
            cursor: pointer; color: #475569; background: none; border: none; font-size: .9rem; padding: 0;
        }
        .pass-toggle:hover { color: #94a3b8; }
        .error-msg {
            color: #f87171; font-size: .8rem; margin-top: .4rem;
            padding: .5rem .75rem; background: rgba(239,68,68,.1); border-radius: 8px;
            display: none;
        }
        .error-msg.show { display: block; }
        .btn-submit {
            width: 100%; padding: .9rem; margin-top: 1.25rem;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border: none; border-radius: 10px; color: white;
            font-family: inherit; font-size: .95rem; font-weight: 600;
            cursor: pointer; transition: all .25s; box-shadow: 0 6px 20px rgba(59,130,246,0.35);
        }
        .btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 28px rgba(59,130,246,0.45); }
        .btn-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: .5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer-link { text-align: center; margin-top: 1.5rem; color: #475569; font-size: .85rem; }
        .footer-link a { color: #60a5fa; text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
        .success-banner {
            background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.3);
            border-radius: 10px; padding: 1rem; text-align: center; color: #34d399;
            font-weight: 500; display: none;
        }
        .strength-bar { height: 4px; border-radius: 2px; margin-top: 6px; transition: all .3s; background: rgba(255,255,255,0.08); }
        .strength-fill { height: 100%; border-radius: 2px; transition: all .3s; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">📈</div>
            <h1>Create Account</h1>
            <p class="subtitle">Join IntraBot Pro — trade smarter.</p>
        </div>

        <div id="successBanner" class="success-banner">
            ✅ Account created! Redirecting to dashboard...
        </div>

        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
                <div class="error-msg" id="emailErr"></div>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" placeholder="trader_name" required>
                <div class="error-msg" id="usernameErr"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="pass-wrap">
                    <input type="password" id="password" name="password" autocomplete="new-password" placeholder="8+ characters" required>
                    <button type="button" class="pass-toggle" id="togglePass" aria-label="Toggle password">👁️</button>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="error-msg" id="passErr"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="pass-wrap">
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" placeholder="Repeat password" required>
                    <button type="button" class="pass-toggle" id="toggleConfirm" aria-label="Toggle confirm">👁️</button>
                </div>
                <div class="error-msg" id="confirmErr"></div>
            </div>
            <div class="error-msg" id="globalErr"></div>
            <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
        </form>

        <div class="footer-link">Already have an account? <a href="/login">Sign in</a></div>
    </div>

    <script>
        // -- Password strength
        document.getElementById('password').addEventListener('input', function () {
            const v = this.value;
            const fill = document.getElementById('strengthFill');
            const score = [/.{8,}/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter(r => r.test(v)).length;
            const colors = ['#ef4444','#f59e0b','#3b82f6','#10b981'];
            const widths = ['25%','50%','75%','100%'];
            fill.style.width = score > 0 ? widths[score - 1] : '0%';
            fill.style.background = score > 0 ? colors[score - 1] : 'transparent';
        });

        // -- Toggle password visibility
        function makeToggle(inputId, btnId) {
            document.getElementById(btnId).addEventListener('click', () => {
                const inp = document.getElementById(inputId);
                inp.type = inp.type === 'password' ? 'text' : 'password';
            });
        }
        makeToggle('password', 'togglePass');
        makeToggle('confirmPassword', 'toggleConfirm');

        // -- Form submission
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            clearErrors();

            const email    = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirm  = document.getElementById('confirmPassword').value;

            let valid = true;
            if (!email.includes('@')) { showErr('emailErr', 'Enter a valid email.'); valid = false; }
            if (!username || username.length < 2) { showErr('usernameErr', 'Username must be at least 2 characters.'); valid = false; }
            if (password.length < 8) { showErr('passErr', 'Password must be at least 8 characters.'); valid = false; }
            if (password !== confirm) { showErr('confirmErr', 'Passwords do not match.'); valid = false; }
            if (!valid) return;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Creating account...';

            try {
                const res  = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    // Store token + show success
                    if (data.access_token) localStorage.setItem('access_token', data.access_token);
                    document.getElementById('successBanner').style.display = 'block';
                    document.getElementById('registerForm').style.display = 'none';
                    setTimeout(() => {
                        // Redirect to credentials setup first
                        window.location.href = '/credentials';
                    }, 1500);
                } else {
                    showErr('globalErr', data.detail || 'Registration failed. Try again.');
                    btn.disabled = false; btn.innerHTML = 'Create Account';
                }
            } catch (err) {
                showErr('globalErr', 'Network error. Please try again.');
                btn.disabled = false; btn.innerHTML = 'Create Account';
            }
        });

        function showErr(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg; el.classList.add('show');
        }
        function clearErrors() {
            document.querySelectorAll('.error-msg').forEach(el => el.classList.remove('show'));
        }
    </script>
</body>
</html>
