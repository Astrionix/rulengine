server {
    server_name bot.deepcodev.site ec2-13-61-252-98.eu-north-1.compute.amazonaws.com;

    # Trading Bot - Proxy to FastAPI on port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_http_version 1.1;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/bot.deepcodev.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.deepcodev.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = bot.deepcodev.site) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name bot.deepcodev.site ec2-13-61-252-98.eu-north-1.compute.amazonaws.com;
    return 404;
}
